<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة عرض البيانات</title>

<style>
:root {
  --primary: #0f6cbf;
  --secondary: #0a4a8a;
  --bg: #f2f5f9;
  --card: #ffffff;
  --text: #2c3e50;
}

body {
  margin: 0;
  font-family: "Tahoma", Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #fff;
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

/* ===== Container ===== */
.container {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 15px;
}

/* ===== Card ===== */
.card {
  background-color: var(--card);
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* ===== Notice ===== */
.notice {
  background-color: #eef4ff;
  color: #0f6cbf;
  padding: 10px;
  text-align: center;
  font-size: 14px;
  border-bottom: 1px solid #dde7f3;
}

/* ===== iframe ===== */
iframe {
  width: 100%;
  height: 75vh;
  border: none;
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  padding: 15px;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  iframe {
    height: 70vh;
  }

  .header {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="header">
  📊 لوحة عرض البيانات
</div>

<div class="container">
  <div class="card">

    <div class="notice">
      🔒 عرض فقط – التعديل بيد الإدارة
    </div>

    <iframe
      src="https://1drv.ms/x/c/1bd3ae2c445a7c6e/IQRcbyyZEPwrRoCWSpFIkRNKAS2CJ5hePLuT2gbARhJvQYk?em=2&wdAllowInteractivity=False&Item='Manth'!A1%3AN61&wdHideGridlines=True&wdDownloadButton=True">
    </iframe>

  </div>
</div>

<div class="footer">
  © جميع الحقوق محفوظة
</div>

</body>
</html>
